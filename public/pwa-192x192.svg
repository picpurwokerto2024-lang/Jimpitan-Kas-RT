  <text x="96" y="167" fill="#FEF08A" font-size="6.5" font-weight="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle" letter-spacing="1.5">JIMPITAN RT</text>
