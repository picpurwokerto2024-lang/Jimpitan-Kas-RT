      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="192" height="192" rx="46" fill="url(#bgGrad192)" />

  <!-- Target Corners -->
  <path d="M 45 66 L 45 51 C 45 46 48 45 53 45 L 66 45" fill="none" stroke="url(#glowGrad192)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 126 45 L 139 45 C 144 45 147 46 147 51 L 147 66" fill="none" stroke="url(#glowGrad192)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 45 126 L 45 141 C 45 146 48 147 53 147 L 66 147" fill="none" stroke="url(#glowGrad192)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 126 147 L 139 147 C 144 147 147 146 147 141 L 147 126" fill="none" stroke="url(#glowGrad192)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Roof Crest -->
  <path d="M 96 48 L 138 81 C 140 83 140 86 138 88 L 131 93 C 129 95 127 94 125 93 L 96 70 L 67 93 C 65 94 63 95 61 93 L 54 88 C 52 86 52 83 54 81 Z" fill="url(#goldGrad192)" />

  <!-- Jimpitan Coin -->
  <circle cx="96" cy="107" r="34" fill="#1E293B" stroke="url(#goldGrad192)" stroke-width="3" />
  <circle cx="96" cy="107" r="30" fill="none" stroke="#FEF08A" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />

  <!-- QR Pattern Mini -->
  <rect x="76" y="87" width="11" height="11" rx="2.5" fill="url(#goldGrad192)" />
  <rect x="79" y="90" width="5" height="5" rx="1" fill="#0F172A" />

  <rect x="105" y="87" width="11" height="11" rx="2.5" fill="url(#goldGrad192)" />
  <rect x="108" y="90" width="5" height="5" rx="1" fill="#0F172A" />

  <rect x="76" y="115" width="11" height="11" rx="2.5" fill="url(#goldGrad192)" />
  <rect x="79" y="118" width="5" height="5" rx="1" fill="#0F172A" />

  <!-- Rp Text -->
  <text x="107" y="123" fill="url(#goldGrad192)" font-size="11" font-weight="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Rp</text>

  <!-- Laser Line -->
  <line x1="39" y1="107" x2="153" y2="107" stroke="url(#laserGrad192)" stroke-width="1.8" stroke-linecap="round" />

  <!-- Bottom Pill -->
